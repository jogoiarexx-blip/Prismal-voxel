<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#181d27" />
    <meta
      name="description"
      content="Explore, construa e sobreviva em um mundo de blocos gerado por você."
    />
    <title>Mundo Prisma</title>
    <link rel="icon" href="art/prisma.png" />
    <link rel="preload" href="art/expedicao.webp" as="image" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="app">
      <section id="home" aria-label="Menu principal">
        <div class="landscape"></div>
        <div class="shade"></div>
        <div class="motes" aria-hidden="true"></div>
        <header class="topline">
          <div class="brand">
            <img src="art/prisma.png" alt="" /><span>PRISMA</span><i></i><small>VOXEL SANDBOX</small>
          </div>
          <nav class="main-nav" aria-label="Navegação principal">
            <span class="nav-current" aria-current="page">⌂ <span>Início</span></span>
            <button id="navGuide" type="button"><i data-ico="book"></i><span>Guia de campo</span></button>
            <button id="navWorlds" type="button"><i data-ico="world"></i><span>Meus mundos</span></button>
            <button id="navOptions" type="button"><i data-ico="gear"></i><span>Opções</span></button>
          </nav>
          <div class="tools">
            <button class="tool" id="sound" title="Ativar som" aria-label="Ativar som"></button
            ><button class="tool" id="full" title="Tela cheia" aria-label="Tela cheia"></button>
          </div>
        </header>
        <div class="hero">
          <div class="kicker"><i></i>ECOS DOS ARQUITETOS<i></i></div>
          <h1 aria-label="Mundo Prisma"><span>MUNDO</span><strong>PRISMA</strong></h1>
          <p>Explore ruínas antigas, desperte os três selos<br />e erga seu próprio Farol Prisma.</p>
          <div class="actions">
            <button class="primary large" id="play">
              <i data-ico="play"></i
              ><span class="play-copy"
                ><strong id="playTitle">Jogar</strong
                ><small id="playDetail">Criar meu primeiro mundo</small></span
              ><kbd>ENTER</kbd>
            </button>
            <div class="twins">
              <button class="secondary" id="worlds"><i data-ico="world"></i>Meus mundos</button
              ><button class="secondary" id="options"><i data-ico="gear"></i>Opções</button>
            </div>
          </div>
        </div>
        <button class="scene-label" id="expCard" aria-label="Abrir o diário da expedição">
          <span class="exp-icon" id="expImage" aria-hidden="true"></span>
          <span class="exp-copy"
            ><small>DIÁRIO DA EXPEDIÇÃO</small><strong id="expTitle">Pórtico da Alvorada</strong
            ><span class="exp-state"><span id="expProgress">0 de 3 selos</span><span class="seal-track" aria-hidden="true"><i></i><i></i><i></i></span></span></span
          >
        </button>
        <footer class="footer">
          <div class="footer-links">
            <button id="guide"><i data-ico="book"></i>Guia de campo</button
            ><button id="quickNew" hidden><i data-ico="plus"></i>Novo mundo</button>
          </div>
          <span class="version"><b></b>VERSÃO 0.9.2</span>
        </footer>
      </section>
      <section id="game" hidden aria-label="Mundo jogável">
        <canvas id="view" tabindex="0" aria-label="Área do jogo"></canvas>
        <div id="held" aria-hidden="true" hidden></div>
        <div id="gamehud">
          <div class="gamehead">
            <div class="location">
              <i data-ico="pin"></i><span id="biome"></span><small id="clock"></small>
            </div>
            <div class="game-tools">
              <button id="build" class="tool build-trigger" title="Construir livremente: escolher blocos (B)" aria-label="Escolher blocos para construção livre">▦ <span>Blocos livres</span></button>
              <button class="tool" id="pause" title="Pausar jogo" aria-label="Pausar jogo">
                <i data-ico="pause"></i>
              </button>
            </div>
          </div>
          <div id="quest"></div>
          <button id="expCompass" title="Abrir diário da expedição">
            <i aria-hidden="true">▲</i><span></span>
          </button>
          <div id="cameraHint" hidden></div>
          <div id="cross"></div>
          <div id="mineFeedback" hidden aria-hidden="true"><span>⛏</span></div>
          <div id="touchImpact" aria-hidden="true"></div>
          <div id="target"></div>
          <div id="breakbar" hidden><span></span></div>
          <div class="hudbottom">
            <div class="hudstats" id="vitals"></div>
            <div id="itemname"></div>
            <div id="hotbar" class="slots"></div>
            <div class="keyhint">
              <kbd>E</kbd> Mochila <b>·</b> <kbd>TAB</kbd> Guia <b>·</b> <kbd>ESC</kbd> Pausa
            </div>
          </div>
          <div id="touch" aria-label="Controles de toque">
            <div class="movecluster">
              <div id="movePad" role="application" aria-label="Joystick de movimentação">
                <div class="move-ring" aria-hidden="true"></div>
                <div id="moveKnob" aria-hidden="true"></div>
                <span class="move-caption">MOVER</span>
              </div>
              <button data-touch="sprint" class="touch-toggle" aria-pressed="false" aria-label="Alternar corrida">⚡ Correr</button>
            </div>
            <div class="touchact">
              <div class="touch-utilities">
                <button data-touch="build" aria-label="Escolher blocos para construir livremente">▥<small>Blocos</small></button>
                <button data-touch="rotate" aria-label="Girar escada ou porta em noventa graus">↻<small>Girar</small></button>
                <button data-touch="bag" aria-label="Abrir mochila">▦<small>Mochila</small></button>
                <button data-touch="camera" aria-label="Trocar câmera">◉<small>Câmera</small></button>
                <button data-touch="crouch" aria-label="Agachar" aria-pressed="false">⌄<small>Agachar</small></button>
                <button data-touch="journal" aria-label="Abrir diário">▤<small>Diário</small></button>
              </div>
              <div class="touch-primary">
                <button data-touch="mine" aria-label="Segurar para quebrar ou atacar">⛏<small>Quebrar</small></button>
                <button data-touch="use" aria-label="Colocar bloco ou interagir">▣<small>Colocar</small></button>
                <button data-touch="jump" aria-label="Pular ou nadar">↥<small id="touchJumpLabel">Pular</small></button>
              </div>
            </div>
            <div id="touchTip" class="touch-tip">Casa livre: escolha blocos · toque para colocar · segure para quebrar</div>
          </div>
          <pre id="debug" hidden></pre>
          <div id="hurt"></div>
        </div>
      </section>
      <div id="overlay" hidden>
        <section
          id="dialog"
          role="dialog"
          aria-modal="true"
          aria-labelledby="panelTitle"
          tabindex="-1"
        ></section>
      </div>
      <div id="toast" role="status" aria-live="polite"></div>
    </main>
    <script defer src="js/icons.js"></script>
    <script defer src="js/build-icons.js"></script>
    <script defer src="js/world.js"></script>
    <script defer src="js/render.js"></script>
    <script defer src="js/store.js"></script>
    <script defer src="js/game.js"></script>
    <script defer src="js/ui.js"></script>
  </body>
</html>
